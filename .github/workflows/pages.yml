name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage the site
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude _site --exclude node_modules --exclude '**/node_modules' ./ _site/
          node -e 'const fs=require("fs"); fs.writeFileSync("_site/poe-key.js", "window.POE_API_KEY="+JSON.stringify(process.env.POE_API_KEY||"")+";\n")'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
