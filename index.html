<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OpenCut</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap"
		/>
		<style>
			:root {
				color-scheme: light;
				--bg: #fff;
				--fg: #171717;
				--muted: #737373;
				--line: #e5e5e5;
				--panel: #fafafa;
				--ink: #111;
			}
			* { box-sizing: border-box; }
			[hidden] { display: none !important; }
			html, body { height: 100%; margin: 0; }
			body {
				background: var(--bg);
				color: var(--fg);
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
				font-size: 14px;
				line-height: 1.5;
			}
			button, input, textarea { font: inherit; color: inherit; }
			button { cursor: pointer; }
			h1, h2, .serif { font-family: "Playfair Display", Georgia, serif; font-weight: 500; }
			.sr {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}
			.gate {
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
			}
			.card {
				width: min(100%, 22rem);
				display: flex;
				flex-direction: column;
				gap: 0.85rem;
			}
			.eyebrow {
				margin: 0;
				font-size: 11px;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.card h1, .top h1 { margin: 0.1rem 0 0; font-size: 2rem; }
			label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 13px; }
			input, textarea {
				border: 1px solid var(--line);
				border-radius: 6px;
				background: #fff;
				padding: 0.45rem 0.6rem;
			}
			textarea { resize: vertical; min-height: 4.5rem; }
			.primary, .ghost, .texty {
				border-radius: 6px;
				border: 1px solid transparent;
				background: transparent;
			}
			.primary { background: var(--ink); color: #fff; padding: 0.45rem 0.7rem; }
			.ghost, .texty { border-color: var(--line); background: #fff; padding: 0.3rem 0.55rem; }
			.primary:disabled { opacity: 0.55; }
			.error { margin: 0; color: #9f1239; min-height: 1.2em; }
			.app { height: 100dvh; display: flex; flex-direction: column; padding: 0.75rem 0.9rem 4.2rem; gap: 0.75rem; }
			.top { display: flex; justify-content: space-between; align-items: flex-end; }
			.who { margin: 0; color: var(--muted); }
			.workspace { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 0.9rem; }
			.stage-col, .chat { min-height: 0; display: flex; flex-direction: column; gap: 0.6rem; }
			.frame-wrap { min-height: 0; flex: 1; display: grid; place-items: center; }
			.frame {
				position: relative;
				background: #111;
				border-radius: 8px;
				overflow: hidden;
				height: min(100%, 720px);
				width: auto;
				max-width: 100%;
				aspect-ratio: 16 / 9;
			}
			.frame.aspect-9-16 { aspect-ratio: 9 / 16; }
			.frame.aspect-1-1 { aspect-ratio: 1; }
			.frame.aspect-4-5 { aspect-ratio: 4 / 5; }
			.frame video { width: 100%; height: 100%; object-fit: contain; background: #111; }
			.frame.fit-cover video { object-fit: cover; }
			.frame.grade-warm video { filter: saturate(0.9) sepia(0.18) contrast(1.02) brightness(1.03); }
			.frame.grade-cool video { filter: saturate(0.82) hue-rotate(12deg) contrast(1.05); }
			.frame.grade-mono video { filter: grayscale(1) contrast(1.06); }
			.frame.grade-vivid video { filter: saturate(1.45) contrast(1.08); }
			.bar { display: none; position: absolute; left: 0; right: 0; height: 13%; background: #000; z-index: 2; }
			.frame.show-bars .bar { display: block; }
			.bar.top { top: 0; }
			.bar.bottom { bottom: 0; }
			#caption {
				position: absolute;
				z-index: 3;
				left: 8%;
				right: 8%;
				margin: 0;
				text-align: center;
				color: #fff;
				font-size: clamp(1rem, 2.4vw, 1.7rem);
				line-height: 1.15;
				text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
			}
			#caption.place-bottom { bottom: 10%; }
			#caption.place-top { top: 8%; }
			#caption.place-center { top: 42%; }
			.frame.show-bars #caption.place-bottom { bottom: 18%; }
			.frame.font-serif #caption { font-family: "Playfair Display", Georgia, serif; }
			.frame.case-lower #caption { text-transform: lowercase; }
			.frame.case-upper #caption { text-transform: uppercase; letter-spacing: 0.04em; }
			.transport { display: flex; align-items: center; gap: 0.6rem; }
			.time { color: var(--muted); font-variant-numeric: tabular-nums; }
			.drop {
				border: 1px dashed var(--line);
				border-radius: 8px;
				padding: 0.55rem 0.7rem;
				background: var(--panel);
			}
			.drop.over { border-color: var(--fg); background: #fff; }
			.drop p { margin: 0.15rem 0 0.4rem; }
			.clips { display: flex; gap: 0.45rem; overflow-x: auto; }
			.chip {
				display: flex;
				flex-direction: column;
				gap: 0.1rem;
				min-width: 8.5rem;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: #fff;
				padding: 0.35rem 0.45rem;
			}
			.chip strong { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.chip span, .muted { color: var(--muted); }
			.chip button { align-self: flex-start; padding: 0; border: 0; background: none; color: var(--muted); }
			.chat { border-left: 1px solid var(--line); padding-left: 0.9rem; }
			.messages { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.7rem; }
			.bubble { margin: 0; white-space: pre-wrap; }
			.bubble.user { align-self: flex-end; background: var(--panel); border-radius: 8px; padding: 0.4rem 0.55rem; max-width: 95%; }
			.composer { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; }
			.help {
				position: fixed;
				right: 1rem;
				bottom: 1rem;
				z-index: 20;
				width: 2.4rem;
				height: 2.4rem;
				border-radius: 999px;
				border: 1px solid var(--line);
				background: #fff;
				font-family: "Playfair Display", Georgia, serif;
				font-size: 1.15rem;
			}
			.menu {
				position: fixed;
				right: 1rem;
				bottom: 3.8rem;
				z-index: 20;
				display: flex;
				flex-direction: column;
				min-width: 11rem;
				padding: 0.3rem;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #fff;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			}
			.menu button {
				text-align: left;
				border: 0;
				background: transparent;
				border-radius: 6px;
				padding: 0.4rem 0.5rem;
			}
			.menu button:hover { background: var(--panel); }
			dialog {
				width: min(920px, calc(100vw - 2rem));
				max-height: min(88dvh, 900px);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 0;
			}
			dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
			.dialog-head, .dialog-body { padding: 1rem 1.1rem; }
			.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
			.dialog-body { overflow: auto; max-height: 70dvh; display: flex; flex-direction: column; gap: 1.4rem; }
			.example { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; }
			.example video { width: 100%; border-radius: 6px; background: #111; }
			.example h3 { margin: 0 0 0.3rem; font-size: 1.25rem; }
			.example p { margin: 0.35rem 0; }
			@media (max-width: 860px) {
				.workspace { grid-template-columns: 1fr; }
				.chat { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 0.7rem; min-height: 16rem; }
				.example { grid-template-columns: 1fr; }
				.app { height: auto; min-height: 100dvh; }
			}
		</style>
	</head>
	<body>
		<section id="gate" class="gate">
			<form id="signin" class="card">
				<div>
					<p class="eyebrow">OpenCut</p>
					<h1>Sign in</h1>
				</div>
				<label>
					Username
					<input id="username" name="username" autocomplete="username" required />
				</label>
				<label>
					Password
					<input id="password" name="password" type="password" autocomplete="current-password" required />
				</label>
				<p id="signin-error" class="error" role="alert"></p>
				<button class="primary" type="submit">Sign in</button>
			</form>
		</section>

		<div id="studio" class="app" hidden>
			<header class="top">
				<div>
					<p class="eyebrow">OpenCut</p>
					<h1>Edit</h1>
				</div>
				<p id="who" class="who"></p>
			</header>
			<div class="workspace">
				<div class="stage-col">
					<div class="frame-wrap">
						<div id="frame" class="frame font-serif">
							<video id="preview" playsinline></video>
							<div class="bar top"></div>
							<div class="bar bottom"></div>
							<p id="caption" class="place-bottom"></p>
						</div>
					</div>
					<div class="transport">
						<button id="play" class="ghost" type="button">Play</button>
						<span id="clock" class="time">0:00 / 0:00</span>
					</div>
					<div id="drop" class="drop">
						<p>Drop footage here, or <button id="browse" class="texty" type="button">browse</button></p>
						<input id="files" class="sr" type="file" accept="video/*" multiple />
						<div id="clips" class="clips"></div>
					</div>
				</div>
				<form id="chat" class="chat">
					<div id="messages" class="messages">
						<p class="bubble">Drop footage, then say what you want. For example: add subtitles and cut this like a quiet morning.</p>
					</div>
					<div class="composer">
						<label class="sr" for="prompt">Tell the editor what to do</label>
						<textarea id="prompt" placeholder="Add subtitles and cut this in a quiet morning style"></textarea>
						<button id="send" class="primary" type="submit">Send</button>
					</div>
				</form>
			</div>
		</div>

		<button id="help" class="help" type="button" hidden aria-haspopup="menu" aria-expanded="false" aria-controls="menu">?</button>
		<div id="menu" class="menu" role="menu" hidden>
			<button type="button" role="menuitem" data-action="examples">Examples</button>
			<button type="button" role="menuitem" data-action="key">Poe key</button>
			<button type="button" role="menuitem" data-action="out">Sign out</button>
		</div>

		<dialog id="examples">
			<div class="dialog-head">
				<div>
					<p class="eyebrow">Examples</p>
					<h2 class="serif" style="margin:0.1rem 0 0">Daily 10s cuts</h2>
				</div>
				<button id="close-examples" class="ghost" type="button">Close</button>
			</div>
			<div id="example-list" class="dialog-body"></div>
		</dialog>

		<dialog id="key-dialog">
			<form id="key-form" class="dialog-body" method="dialog">
				<div>
					<p class="eyebrow">Poe</p>
					<h2 class="serif" style="margin:0.1rem 0 0">API key</h2>
					<p class="muted">Saved in this browser only. The editor uses it to talk to Poe.</p>
				</div>
				<label>
					Key
					<input id="key-input" type="password" autocomplete="off" />
				</label>
				<div style="display:flex; gap:0.5rem">
					<button class="primary" type="submit">Save</button>
					<button id="close-key" class="ghost" type="button">Close</button>
				</div>
			</form>
		</dialog>

		<script src="poe-key.js"></script>
		<script>
			const ACCOUNT = { username: "khkwong", password: "1128" }
			const SESSION = "opencut-session"
			const KEY_STORE = "opencut-poe-key"
			const MODEL = "Claude-Sonnet-4.6"

			const knownExamples = {
				"2026-11-21-quiet-press": {
					prompt:
						"Use the coffee-press footage. Keep only the last 10 seconds, starting at 58.5 seconds, at normal speed. Cut it in the Minimalistic homie style: a quiet 9:16 frame, warm paper grade, the whole gesture kept in view. Put a small lowercase serif title in the top margin, two lines: slow morning / for one. Short fades, a slight push in, and do not cover the pour.",
					how:
						"OpenCut loaded preset minimalistic-homie 1.1.0 into a project. The canvas is 1080×1920. The picture is contained, and the source letterbox is cropped so the red mug stays in frame. The grade is a light warm pass (saturation 0.9, temperature +6). The title is Playfair Display at the editor's smallest size, high in the frame. Dissolves are 0.35s in and 0.4s out. The timeline is daily/cuts/2026-11-21-quiet-press/project.json.",
				},
				"2026-11-21-fog-hold": {
					prompt:
						"Use the Vetla fog drone. Hold 10 seconds from 2 seconds, at 24 frames a second. Cut it in the Cinematic bars style: 16:9, black bars leaving about three quarters of the frame open, a slow push. A serif title sits low inside the open window, two lines: hold / the frame. Keep the fog bright.",
					how:
						"OpenCut loaded preset cinematic-bars 1.1.0. A cinematic-bars mask opens 0.74 of the frame. The title sits at 0.28 of the height so the second line stays above the lower bar. The grade stays open (contrast 1.06, saturation 0.88) after an earlier pass crushed the fog. Dissolves are 0.45s in and 0.5s out. The source has no audio, so the preview is silent. The timeline is daily/cuts/2026-11-21-fog-hold/project.json.",
				},
				"2026-11-24-pale-rose": {
					prompt:
						"Use the yellow-rose macro. Hold 10 seconds from 8 seconds, at normal speed. Cut it in the Indie fashion cute style: a 4:5 frame, blush paper, italic serif, lowercase. Two lines: pale rose / held close. Let the bloom fill the frame, and keep the yellow open.",
					how:
						"OpenCut loaded preset indie-fashion-cute 1.1.0. The canvas is 1080×1350. The picture covers the frame, so the 16:9 macro is not a strip between empty margins. The grade stays light (contrast 1.02, saturation 0.96, temperature +3) and the extra blur is off, so the inner petals keep an edge. The italic title sits high in the soft petals, clear of the sharp center. Dissolves are 0.35s in and 0.45s out. The timeline is daily/cuts/2026-11-24-pale-rose/project.json.",
				},
			}

			const state = {
				clips: [],
				edit: null,
				playing: false,
				outputTime: 0,
				segmentIndex: -1,
				messages: [],
			}

			const gate = document.getElementById("gate")
			const studio = document.getElementById("studio")
			const help = document.getElementById("help")
			const menu = document.getElementById("menu")
			const frame = document.getElementById("frame")
			const preview = document.getElementById("preview")
			const caption = document.getElementById("caption")
			const clipsEl = document.getElementById("clips")
			const clock = document.getElementById("clock")
			const messages = document.getElementById("messages")
			const promptEl = document.getElementById("prompt")
			const sendBtn = document.getElementById("send")

			function signedIn() {
				return localStorage.getItem(SESSION) === ACCOUNT.username
			}

			function showStudio() {
				gate.hidden = true
				studio.hidden = false
				help.hidden = false
				document.getElementById("who").textContent = ACCOUNT.username
			}

			function showGate() {
				studio.hidden = true
				help.hidden = true
				menu.hidden = true
				help.setAttribute("aria-expanded", "false")
				gate.hidden = false
			}

			document.getElementById("signin").addEventListener("submit", (event) => {
				event.preventDefault()
				const username = document.getElementById("username").value.trim()
				const password = document.getElementById("password").value
				const error = document.getElementById("signin-error")
				if (username !== ACCOUNT.username || password !== ACCOUNT.password) {
					error.textContent = "That sign-in is not the one for this studio."
					return
				}
				error.textContent = ""
				localStorage.setItem(SESSION, username)
				showStudio()
			})

			function poeKey() {
				return localStorage.getItem(KEY_STORE) || window.POE_API_KEY || ""
			}

			function toggleMenu(force) {
				const open = typeof force === "boolean" ? force : menu.hidden
				menu.hidden = !open
				help.setAttribute("aria-expanded", open ? "true" : "false")
			}

			help.addEventListener("click", () => toggleMenu())
			document.addEventListener("click", (event) => {
				if (menu.hidden) return
				if (event.target === help || menu.contains(event.target)) return
				toggleMenu(false)
			})
			menu.addEventListener("click", (event) => {
				const action = event.target.closest("button")?.dataset.action
				if (!action) return
				toggleMenu(false)
				if (action === "examples") openExamples()
				if (action === "key") openKey()
				if (action === "out") {
					localStorage.removeItem(SESSION)
					preview.pause()
					state.playing = false
					showGate()
				}
			})

			function openKey() {
				document.getElementById("key-input").value = poeKey()
				document.getElementById("key-dialog").showModal()
			}
			document.getElementById("close-key").addEventListener("click", () => {
				document.getElementById("key-dialog").close()
			})
			document.getElementById("key-form").addEventListener("submit", () => {
				const value = document.getElementById("key-input").value.trim()
				if (value) localStorage.setItem(KEY_STORE, value)
				else localStorage.removeItem(KEY_STORE)
			})

			async function openExamples() {
				const list = document.getElementById("example-list")
				list.replaceChildren(el("p", "muted", "Loading the daily cuts…"))
				document.getElementById("examples").showModal()
				let cuts = []
				try {
					const response = await fetch("daily/index.json")
					const index = await response.json()
					cuts = Array.isArray(index.cuts) ? index.cuts : []
				} catch (error) {
					console.error(error)
				}
				if (cuts.length === 0) {
					cuts = [
						{
							id: "2026-11-21-quiet-press",
							theme: "Minimalistic homie",
							shows: "A hand lifts a French press and pours coffee into a red mug on a kitchen counter.",
							paths: { preview: "daily/cuts/2026-11-21-quiet-press/preview.mp4" },
						},
						{
							id: "2026-11-21-fog-hold",
							theme: "Cinematic bars",
							shows: "A drone drifts over morning fog above the village of Vetla.",
							paths: { preview: "daily/cuts/2026-11-21-fog-hold/preview.mp4" },
						},
						{
							id: "2026-11-24-pale-rose",
							theme: "Indie fashion cute",
							shows: "A macro lens rests on a yellow rose, and the bloom fills the frame.",
							paths: { preview: "daily/cuts/2026-11-24-pale-rose/preview.mp4" },
						},
					]
				}
				list.replaceChildren()
				for (const cut of cuts) {
					const known = knownExamples[cut.id] || {}
					const article = el("article", "example")
					const video = document.createElement("video")
					video.controls = true
					video.playsInline = true
					video.preload = "metadata"
					video.poster = (cut.paths?.preview || "").replace(/preview\.mp4$/, "poster.jpg")
					video.src = cut.paths?.preview || ""
					const copy = el("div")
					copy.append(el("h3", "serif", cut.theme || cut.id))
					if (cut.shows) copy.append(el("p", null, cut.shows))
					copy.append(el("p", "eyebrow", "Told to OpenCut"))
					copy.append(el("p", null, known.prompt || "This cut is in the index. Its prompt is not written here yet."))
					copy.append(el("p", "eyebrow", "What OpenCut did"))
					copy.append(el("p", "muted", known.how || cut.shows || ""))
					if (cut.footage) {
						const license = el("p", "muted")
						const source = document.createElement("a")
						source.href = cut.footage.sourceUrl
						source.textContent = cut.footage.title
						source.target = "_blank"
						source.rel = "noopener noreferrer"
						license.append(source, " · " + cut.footage.license)
						copy.append(license)
					}
					article.append(video, copy)
					list.append(article)
				}
			}
			document.getElementById("close-examples").addEventListener("click", () => {
				document.getElementById("examples").close()
				for (const video of document.querySelectorAll("#example-list video")) video.pause()
			})

			function el(tag, className, text) {
				const node = document.createElement(tag)
				if (className) node.className = className
				if (text) node.textContent = text
				return node
			}

			function addFiles(fileList) {
				for (const file of fileList) {
					if (!file.type.startsWith("video/")) continue
					const clip = {
						name: file.name,
						url: URL.createObjectURL(file),
						duration: 0,
						width: 0,
						height: 0,
					}
					state.clips.push(clip)
					const probe = document.createElement("video")
					probe.preload = "metadata"
					probe.src = clip.url
					probe.addEventListener("loadedmetadata", () => {
						clip.duration = probe.duration || 0
						clip.width = probe.videoWidth || 0
						clip.height = probe.videoHeight || 0
						renderClips()
						if (!state.playing && state.outputTime === 0) {
							const cuts = timeline()
							const first = cuts[0]
							if (first) loadSegment(cuts, 0, Math.min(first.start + 0.8, first.end - 0.05))
						}
						paintFrame()
					})
				}
				renderClips()
				paintFrame()
			}

			function renderClips() {
				clipsEl.replaceChildren()
				state.clips.forEach((clip, index) => {
					const chip = el("div", "chip")
					chip.append(el("strong", null, index + 1 + "  " + clip.name))
					chip.append(el("span", null, clip.duration ? formatTime(clip.duration) : "…"))
					const remove = el("button", null, "Remove")
					remove.type = "button"
					remove.addEventListener("click", () => {
						URL.revokeObjectURL(clip.url)
						state.clips.splice(index, 1)
						state.edit = null
						state.outputTime = 0
						state.segmentIndex = -1
						preview.removeAttribute("src")
						renderClips()
						paintFrame()
					})
					chip.append(remove)
					clipsEl.append(chip)
				})
			}

			const drop = document.getElementById("drop")
			drop.addEventListener("dragover", (event) => {
				event.preventDefault()
				drop.classList.add("over")
			})
			drop.addEventListener("dragleave", () => drop.classList.remove("over"))
			drop.addEventListener("drop", (event) => {
				event.preventDefault()
				drop.classList.remove("over")
				addFiles(event.dataTransfer.files)
			})
			document.getElementById("browse").addEventListener("click", () => {
				document.getElementById("files").click()
			})
			document.getElementById("files").addEventListener("change", (event) => {
				addFiles(event.target.files)
				event.target.value = ""
			})

			function formatTime(seconds) {
				const total = Math.max(0, Math.floor(seconds))
				const minutes = Math.floor(total / 60)
				const remain = String(total % 60).padStart(2, "0")
				return minutes + ":" + remain
			}

			function timeline() {
				const cuts = []
				const requested = state.edit?.clips
				const source = requested?.length
					? requested
					: state.clips.map((_, index) => ({
							index,
							start: 0,
							end: state.clips[index].duration || 0,
						}))
				let at = 0
				for (const item of source) {
					const clip = state.clips[item.index]
					if (!clip || !clip.duration) continue
					const start = clamp(Number(item.start) || 0, 0, clip.duration)
					const end = clamp(Number(item.end) || clip.duration, start + 0.05, clip.duration)
					const length = end - start
					cuts.push({ index: item.index, start, end, outStart: at, outEnd: at + length })
					at += length
				}
				return cuts
			}

			function clamp(value, min, max) {
				return Math.min(max, Math.max(min, value))
			}

			function paintFrame() {
				const edit = state.edit || {}
				const aspect = ["9:16", "16:9", "1:1", "4:5"].includes(edit.aspect)
					? edit.aspect
					: guessAspect()
				frame.className = "frame"
				frame.classList.add("aspect-" + aspect.replace(":", "-"))
				frame.classList.add(edit.font === "sans" ? "font-sans" : "font-serif")
				frame.classList.add("case-" + (edit.textCase === "upper" || edit.textCase === "lower" ? edit.textCase : "as"))
				if (["warm", "cool", "mono", "vivid"].includes(edit.grade)) frame.classList.add("grade-" + edit.grade)
				if (edit.fit === "cover") frame.classList.add("fit-cover")
				frame.classList.toggle("show-bars", Boolean(edit.bars))
				const cuts = timeline()
				const total = cuts.length ? cuts[cuts.length - 1].outEnd : 0
				clock.textContent = formatTime(state.outputTime) + " / " + formatTime(total)
				const line = (edit.subtitles || []).find(
					(cue) => state.outputTime >= Number(cue.start) && state.outputTime < Number(cue.end),
				)
				caption.textContent = line ? String(line.text || "") : ""
				caption.className = "place-" + (line?.place === "top" || line?.place === "center" ? line.place : "bottom")
			}

			function guessAspect() {
				const clip = state.clips[0]
				if (clip && clip.height > clip.width) return "9:16"
				return "16:9"
			}

			async function loadSegment(cuts, index, at) {
				const cut = cuts[index]
				if (!cut) return
				const clip = state.clips[cut.index]
				state.segmentIndex = index
				if (preview.dataset.clip !== String(cut.index)) {
					preview.dataset.clip = String(cut.index)
					preview.src = clip.url
					await new Promise((resolve) => {
						preview.addEventListener("loadedmetadata", resolve, { once: true })
					})
				}
				if (Math.abs((preview.currentTime || 0) - at) > 0.08) {
					preview.currentTime = at
					await new Promise((resolve) => {
						preview.addEventListener("seeked", resolve, { once: true })
					})
				}
			}

			function currentCut(cuts) {
				return cuts.findIndex((cut) => state.outputTime >= cut.outStart && state.outputTime < cut.outEnd - 0.02)
			}

			document.getElementById("play").addEventListener("click", async () => {
				if (state.playing) {
					state.playing = false
					following = false
					preview.pause()
					document.getElementById("play").textContent = "Play"
					return
				}
				const cuts = timeline()
				if (!cuts.length) return
				state.playing = true
				document.getElementById("play").textContent = "Pause"
				let index = currentCut(cuts)
				if (index < 0) {
					state.outputTime = 0
					index = 0
				}
				const cut = cuts[index]
				await loadSegment(cuts, index, cut.start + (state.outputTime - cut.outStart))
				if (state.playing) {
					startFollow()
					preview.play()
				}
			})

			let following = false
			function follow() {
				if (!following) return
				const cuts = timeline()
				const cut = cuts[state.segmentIndex]
				if (cut && state.playing) {
					const local = preview.currentTime
					state.outputTime = cut.outStart + Math.max(0, local - cut.start)
					if (local >= cut.end - 0.05) {
						const next = state.segmentIndex + 1
						state.playing = false
						if (!cuts[next]) {
							state.outputTime = cut.outEnd
							preview.pause()
							document.getElementById("play").textContent = "Play"
							following = false
						} else {
							state.outputTime = cuts[next].outStart
							loadSegment(cuts, next, cuts[next].start).then(() => {
								state.playing = true
								preview.play()
							})
						}
					}
					paintFrame()
				}
				if (following) requestAnimationFrame(follow)
			}
			function startFollow() {
				if (following) return
				following = true
				requestAnimationFrame(follow)
			}

			function clipBrief() {
				if (!state.clips.length) return "No footage yet."
				return state.clips
					.map((clip, index) => index + " " + clip.name + " " + (clip.duration ? clip.duration.toFixed(2) + "s" : "duration unknown") + (clip.height > clip.width ? " portrait" : " landscape"))
					.join("\n")
			}

			function systemPrompt() {
				return [
					"You are the editor inside OpenCut. The user dropped footage and will tell you how to cut it.",
					"Reply with a short plain-language answer, then one json fence that the player applies.",
					"JSON shape:",
					'{"aspect":"16:9|9:16|1:1|4:5","grade":"none|warm|cool|mono|vivid","font":"serif|sans","textCase":"lower|upper|as-typed","bars":false,"fit":"contain|cover","clips":[{"index":0,"start":0,"end":4}],"subtitles":[{"start":0,"end":2,"text":"line","place":"bottom|top|center"}]}',
					"clip start and end are seconds inside that file. subtitle start and end are seconds on the finished cut.",
					"Keep a cut near 10 seconds unless they ask otherwise. Use the real clip durations. Do not invent clip indexes.",
					"Styles: minimalistic homie is 9:16 warm serif lowercase, one long hold, title high. cinematic bars is 16:9 warm serif with bars true and the title low. playful gamer is 9:16 vivid sans uppercase. genz adhd is 9:16 vivid sans with several short clips and short subtitle chips. indie fashion cute is 4:5 warm serif lowercase. editorial is 16:9 mono serif.",
					"If there is no footage, say so and return clips as an empty array.",
					"Footage:",
					clipBrief(),
				].join("\n")
			}

			function extractEdit(text) {
				const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/)
				let edit = null
				if (fence) {
					try {
						edit = JSON.parse(fence[1])
					} catch (error) {
						edit = null
					}
				}
				const reply = text.replace(/```[\s\S]*?```/g, "").trim()
				return { reply, edit }
			}

			function sanitize(edit) {
				if (!edit || typeof edit !== "object") return null
				const clips = Array.isArray(edit.clips)
					? edit.clips
							.filter((clip) => Number.isInteger(clip.index) && state.clips[clip.index])
							.map((clip) => ({
								index: clip.index,
								start: Number(clip.start) || 0,
								end: Number(clip.end) || state.clips[clip.index].duration || 0,
							}))
					: []
				const subtitles = Array.isArray(edit.subtitles)
					? edit.subtitles
							.filter((cue) => cue && typeof cue.text === "string")
							.map((cue) => ({
								start: Number(cue.start) || 0,
								end: Number(cue.end) || 0,
								text: cue.text,
								place: cue.place === "top" || cue.place === "center" ? cue.place : "bottom",
							}))
					: []
				return {
					aspect: edit.aspect,
					grade: edit.grade,
					font: edit.font,
					textCase: edit.textCase,
					bars: Boolean(edit.bars),
					fit: edit.fit === "cover" ? "cover" : "contain",
					clips,
					subtitles,
				}
			}

			function addBubble(role, text) {
				const node = el("p", "bubble" + (role === "user" ? " user" : ""), text)
				messages.append(node)
				messages.scrollTop = messages.scrollHeight
			}

			document.getElementById("chat").addEventListener("submit", async (event) => {
				event.preventDefault()
				const text = promptEl.value.trim()
				if (!text) return
				promptEl.value = ""
				addBubble("user", text)
				state.messages.push({ role: "user", content: text })
				const key = poeKey()
				if (!key) {
					addBubble("assistant", "Add a Poe key from the ? menu. It stays in this browser.")
					return
				}
				sendBtn.disabled = true
				sendBtn.textContent = "Cutting…"
				try {
					const response = await fetch("https://api.poe.com/v1/chat/completions", {
						method: "POST",
						headers: {
							Authorization: "Bearer " + key,
							"Content-Type": "application/json",
						},
						body: JSON.stringify({
							model: MODEL,
							temperature: 0.4,
							max_tokens: 1200,
							messages: [{ role: "system", content: systemPrompt() }, ...state.messages],
						}),
					})
					const payload = await response.json()
					if (!response.ok) {
						const detail = payload?.error?.message || "Poe returned " + response.status
						addBubble("assistant", detail)
						return
					}
					const content = payload?.choices?.[0]?.message?.content
					const answer = typeof content === "string" ? content : ""
					state.messages.push({ role: "assistant", content: answer })
					const parsed = extractEdit(answer)
					const edit = sanitize(parsed.edit)
					if (edit) {
						state.edit = edit
						state.outputTime = 0
						state.segmentIndex = -1
						state.playing = false
						preview.pause()
						document.getElementById("play").textContent = "Play"
						const cuts = timeline()
						if (cuts[0]) loadSegment(cuts, 0, cuts[0].start)
						paintFrame()
					}
					addBubble("assistant", parsed.reply || answer || "No reply.")
					if (!edit) addBubble("assistant", "I couldn't read an edit from that reply, so the preview stayed as it was.")
				} catch (error) {
					addBubble("assistant", "The editor couldn't reach Poe.")
					console.error(error)
				} finally {
					sendBtn.disabled = false
					sendBtn.textContent = "Send"
				}
			})

			if (signedIn()) showStudio()
			else showGate()
		</script>
	</body>
</html>
